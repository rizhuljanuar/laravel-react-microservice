services:
  db:
    image: mysql:8.4
    container_name: admin-db
    environment:
      MYSQL_DATABASE: admin
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "33066:3306"
    volumes:
      - db-data:/var/lib/mysql
    networks:
      - app

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: admin-api
    environment:
      DB_HOST: db
      DB_DATABASE: admin
      DB_USERNAME: root
      DB_PASSWORD: root
    ports:
      - "8000:8000"
    volumes:
      - .:/var/www
      - /var/www/vendor
    depends_on:
      - db
    networks:
      - app

networks:
  app:

volumes:
  db-data:
